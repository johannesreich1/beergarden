<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biergarten Freunde · Deckelstapel</title>
<style>
/* ============================================================
   DECKELSTAPEL
   Signature: a tour is a stack of beer mats — one mat per stop,
   fanned out so you can read every name. The stack is the whole
   visual: no cards, no chips, no badges anywhere else on the page.
   Reduction: a mat holds four things, because a real one does —
   name, time, how far, what the Maß costs.
   ============================================================ */
:root{
  --grund:#D9C9A6;         /* pressed board */
  --flaeche:#F2E9D3;       /* the mat itself, lighter than the table */
  --schrift:#231A0D;
  --weich:#5C4A2C;
  --akzent:#0F3E7A;        /* the printed blue on a mat */
  --akzent-2:#9C3311;
  --kante:rgba(35,26,13,.32);

  --display:"Arial Black","Helvetica Neue",Impact,sans-serif;
  --text:"American Typewriter","Courier New",serif;
}
[data-theme="dark"]{
  --grund:#1B160D; --flaeche:#2A2314; --schrift:#F3E8CE; --weich:#C0AC84;
  --akzent:#7FA9E0; --akzent-2:#E68B5E; --kante:rgba(243,232,206,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--grund);color:var(--schrift);font:17px/1.6 var(--text)}
.wrap{max-width:1080px;margin:0 auto;padding:34px 20px 70px}

h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(27px,5.6vw,40px);
  line-height:.98;letter-spacing:-.025em;text-transform:uppercase}
h1 span{color:var(--akzent)}
.lead{margin:12px 0 0;max-width:42ch;font-size:16.5px;color:var(--weich)}

/* ---- three questions, one row ---- */
.fragen{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0 0;align-items:stretch}
.feld{flex:1 1 200px;background:var(--flaeche);box-shadow:inset 0 0 0 2px var(--kante);
  padding:12px 14px}
.feld label{display:block;font-size:14.5px;color:var(--weich);margin-bottom:3px}
.feld input,.feld select{width:100%;border:0;background:transparent;color:var(--schrift);
  font:19px/1.2 var(--display);font-weight:900;letter-spacing:-.01em}
.feld select{appearance:none;cursor:pointer}
.los{flex:1 1 160px;border:0;cursor:pointer;background:var(--akzent);color:var(--flaeche);
  font-family:var(--display);font-size:17px;font-weight:900;text-transform:uppercase;
  letter-spacing:.04em;padding:16px}

h2{margin:36px 0 16px;font-family:var(--display);font-size:17px;font-weight:900;
  text-transform:uppercase;letter-spacing:.04em;color:var(--weich)}

/* ---- the stacks ---- */
.stapel-reihe{display:grid;gap:26px}
@media(min-width:820px){.stapel-reihe{grid-template-columns:repeat(3,1fr)}}
.stapel{border:0;background:transparent;padding:0;cursor:pointer;text-align:left;
  color:inherit;font:inherit;position:relative;padding-bottom:12px}
.deckel{background:var(--flaeche);box-shadow:inset 0 0 0 2px var(--kante);
  padding:14px 15px;margin-top:-6px;position:relative}
.deckel:first-of-type{margin-top:0}
.stapel .deckel:nth-child(1){transform:rotate(-1.1deg)}
.stapel .deckel:nth-child(2){transform:rotate(.9deg)}
.stapel .deckel:nth-child(3){transform:rotate(-.6deg)}
.deckel .name{display:block;font-family:var(--display);font-size:18px;font-weight:900;line-height:1.15}
.deckel .unten{display:flex;justify-content:space-between;gap:12px;margin-top:6px;
  font-size:15px;color:var(--weich)}
.deckel .mass{color:var(--akzent-2);font-family:var(--display);font-weight:900;font-size:16px}
.stapel .summe{display:block;margin-top:14px;font-size:16px;color:var(--weich)}
.stapel.an .deckel{box-shadow:inset 0 0 0 3px var(--akzent)}
.stapel.an .summe{color:var(--akzent);font-family:var(--display);font-weight:900}

footer{margin-top:34px;font-size:15px;color:var(--weich)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Biergarten <span>Freunde</span></h1>
  <p class="lead">Ein Deckel je Station. Drei Fragen, dann liegt der Abend auf dem Tisch.</p>

  <div class="fragen">
    <div class="feld">
      <label for="ort">Wo gehst du los</label>
      <input id="ort" value="Candidplatz">
    </div>
    <div class="feld">
      <label for="zeit">Wie lange hast du</label>
      <select id="zeit"><option>4 Stunden</option><option>3 Stunden</option><option>6 Stunden</option></select>
    </div>
    <div class="feld">
      <label for="wie">Wie unterwegs</label>
      <select id="wie"><option>Zu Fuß und Radl</option><option>Mit allem</option></select>
    </div>
    <button class="los">Tour bauen</button>
  </div>

  <h2>Drei Abende</h2>
  <div class="stapel-reihe">
    <button class="stapel an">
      <div class="deckel">
        <span class="name">Zum Flaucher</span>
        <span class="unten"><span>16:30 · 18 min</span><span class="mass">10,80</span></span>
      </div>
      <div class="deckel">
        <span class="name">Gasthof Hinterbrühl</span>
        <span class="unten"><span>18:40 · 12 min</span><span class="mass">10,40</span></span>
      </div>
      <span class="summe">2 Stationen · 3 Std 40 · zurück um 20:10</span>
    </button>

    <button class="stapel">
      <div class="deckel">
        <span class="name">Hirschgarten</span>
        <span class="unten"><span>16:30 · 22 min</span><span class="mass">10,20</span></span>
      </div>
      <div class="deckel">
        <span class="name">Taxisgarten</span>
        <span class="unten"><span>18:10 · 9 min</span><span class="mass">9,90</span></span>
      </div>
      <div class="deckel">
        <span class="name">Augustiner-Keller</span>
        <span class="unten"><span>19:30 · 14 min</span><span class="mass">10,60</span></span>
      </div>
      <span class="summe">3 Stationen · 3 Std 55 · zurück um 20:25</span>
    </button>

    <button class="stapel">
      <div class="deckel">
        <span class="name">Michaeligarten</span>
        <span class="unten"><span>17:00 · 15 min</span><span class="mass">9,80</span></span>
      </div>
      <div class="deckel">
        <span class="name">Hofbräukeller</span>
        <span class="unten"><span>18:50 · 11 min</span><span class="mass">11,20</span></span>
      </div>
      <span class="summe">2 Stationen · 3 Std 10 · zurück um 20:10</span>
    </button>
  </div>

  <footer>Preise sind Beispielwerte — der Crawler füllt sie.</footer>
</div>
<script>
  const p = new URLSearchParams(location.search).get('theme')
  if (p) document.documentElement.dataset.theme = p
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biergarten Freunde · Schaumkrone</title>
<link rel="stylesheet" href="basis.css">
<style>

/* SCHAUMKRONE — every mat is freshly poured: foam along the top edge.
   The chosen tour is the only one whose foam runs over the sides, so
   "chosen" is a state of the beer and not a coloured border. */
.einfach{margin-top:22px}
.tour{margin:0 0 30px}
.tour .deckel{padding-top:22px}
.tour.an .deckel{box-shadow:inset 0 0 0 3px var(--akzent)}
.tour.an .schaumkrone{left:-9px;right:-9px;height:17px;top:-14px}
.tour .zeile{display:flex;justify-content:space-between;gap:16px;align-items:baseline;margin-top:9px}
.tour .summe{font-size:15.5px;color:var(--weich)}
.chipreihe .chip{flex:1 1 190px}

</style>
</head>
<body>
<div class="wrap">
  <header data-kopf></header>
  <div class="riss-kante"></div>
  <p class="lead">Frisch gezapft: drei Abende, drei Fragen.</p>
  <div class="einfach">
    <div class="chipreihe">
      <button class="chip" popovertarget="p-ort"><span class="was">Wo gehst du los</span><span class="wert">Candidplatz</span></button>
      <button class="chip" popovertarget="p-zeit"><span class="was">Wie lange hast du</span><span class="wert">4 Stunden</span></button>
      <button class="chip" popovertarget="p-weg"><span class="was">Wie unterwegs</span><span class="wert">Zu Fuß &amp; Radl</span></button>
    </div>

    <h2>Drei Abende</h2>
    
    <button class="tour an">
      <span class="deckel"><span class="schaumkrone oben"></span>
        <span class="name">Flaucher → Hinterbrühl</span>
        <span class="zeile"><span class="summe">2 Stationen · 3 Std 40 · zurück um 20:10</span><span class="korken" style="--gr:54px" aria-pressed="true"><span class="rand"></span><span class="mitte"><span class="zahl">2</span><span class="wort">Halte</span></span></span></span>
      </span>
    </button>
    <button class="tour ">
      <span class="deckel"><span class="schaumkrone oben"></span>
        <span class="name">Hirschgarten → Taxisgarten → Keller</span>
        <span class="zeile"><span class="summe">3 Stationen · 3 Std 55 · zurück um 20:25</span><span class="korken" style="--gr:54px" aria-pressed="true"><span class="rand"></span><span class="mitte"><span class="zahl">3</span><span class="wort">Halte</span></span></span></span>
      </span>
    </button>
    <button class="tour ">
      <span class="deckel"><span class="schaumkrone oben"></span>
        <span class="name">Michaeligarten → Hofbräukeller</span>
        <span class="zeile"><span class="summe">2 Stationen · 3 Std 10 · zurück um 20:10</span><span class="korken" style="--gr:54px" aria-pressed="true"><span class="rand"></span><span class="mitte"><span class="zahl">2</span><span class="wort">Halte</span></span></span></span>
      </span>
    </button>

    <h2>Dein Abend</h2>
    <div class="halt"><span class="wann">16:30</span><span class="name">Zum Flaucher<small>18 min mit dem Radl · offen bis 23:00</small></span><span class="mass">10,80</span></div>
    <div class="halt"><span class="wann">18:40</span><span class="name">Gasthof Hinterbrühl<small>12 min mit dem Radl · offen bis 23:00</small></span><span class="mass">10,40</span></div>
  </div>
  <footer>Preise sind Beispielwerte — der Crawler füllt sie.</footer>
  <div data-profi></div>
</div>
<div data-panels></div>
<script src="basis.js"></script>
</body>
</html>

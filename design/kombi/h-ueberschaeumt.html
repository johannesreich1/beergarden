<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biergarten Freunde · Überschäumt</title>
<link rel="stylesheet" href="basis.css">
<style>

/* ÜBERSCHÄUMT — the chosen tour runs over. Foam spills past the mat on
   both edges, which is the one moment of excess the page permits and
   therefore reads instantly as "this is the one". */
.tour{margin-bottom:30px}
.tour .deckel{padding:22px}
.tour .schaumkrone{opacity:0}
.tour.an .schaumkrone{opacity:1;left:-14px;right:-14px;height:19px}
.tour.an .deckel{box-shadow:inset 0 0 0 3px var(--akzent)}
.tour .zeile{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:10px}
.tour .summe{font-size:15.5px;color:var(--weich)}

</style>
</head>
<body>
<div class="wrap">
  <header data-kopf></header>
  <div class="riss-kante"></div>
  <p class="lead">Die gewählte Tour schäumt über. Mehr Hinweis braucht es nicht.</p>
  <div class="einfach">
    <div class="chipreihe"><button class="chip" popovertarget="p-ort"><span class="was">Wo gehst du los</span><span class="wert">Candidplatz</span></button>
      <button class="chip" popovertarget="p-zeit"><span class="was">Wie lange hast du</span><span class="wert">4 Stunden</span></button>
      <button class="chip" popovertarget="p-weg"><span class="was">Wie unterwegs</span><span class="wert">Zu Fuß &amp; Radl</span></button></div>
    <h2>Drei Abende</h2>
    
    <button class="tour an"><span class="deckel">
      <span class="schaumkrone oben"></span><span class="schaumkrone unten"></span>
      <span class="name">Flaucher → Hinterbrühl</span>
      <span class="zeile"><span class="summe">2 Stationen · 3 Std 40 · zurück um 20:10</span><span class="korken" style="--gr:56px" aria-pressed="true"><span class="rand"></span><span class="mitte"><span class="zahl">2</span><span class="wort">Halte</span></span></span></span>
    </span></button>
    <button class="tour "><span class="deckel">
      <span class="schaumkrone oben"></span><span class="schaumkrone unten"></span>
      <span class="name">Hirschgarten → Taxisgarten → Keller</span>
      <span class="zeile"><span class="summe">3 Stationen · 3 Std 55 · zurück um 20:25</span><span class="korken" style="--gr:56px" aria-pressed="true"><span class="rand"></span><span class="mitte"><span class="zahl">3</span><span class="wort">Halte</span></span></span></span>
    </span></button>
    <button class="tour "><span class="deckel">
      <span class="schaumkrone oben"></span><span class="schaumkrone unten"></span>
      <span class="name">Michaeligarten → Hofbräukeller</span>
      <span class="zeile"><span class="summe">2 Stationen · 3 Std 10 · zurück um 20:10</span><span class="korken" style="--gr:56px" aria-pressed="true"><span class="rand"></span><span class="mitte"><span class="zahl">2</span><span class="wort">Halte</span></span></span></span>
    </span></button>
    <h2>Dein Abend</h2>
    <div class="halt"><span class="wann">16:30</span><span class="name">Zum Flaucher<small>18 min mit dem Radl · offen bis 23:00</small></span><span class="mass">10,80</span></div>
    <div class="halt"><span class="wann">18:40</span><span class="name">Gasthof Hinterbrühl<small>12 min mit dem Radl · offen bis 23:00</small></span><span class="mass">10,40</span></div>
  </div>
  <footer>Preise sind Beispielwerte — der Crawler füllt sie.</footer>
  <div data-profi></div>
</div>
<div data-panels></div>
<script src="basis.js"></script>
</body>
</html>

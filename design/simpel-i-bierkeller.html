<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biergarten Freunde · Bierkeller</title>
<style>
/* ============================================================
   BIERKELLER
   Signature: the barrel vault. One arch frames the whole page,
   and the tour hangs inside it like the lamps in a cellar — a
   single vertical line of light with the stops threaded on it.
   The dark ground is not a mood: it makes the one warm colour
   (the lamp) the only thing the eye goes to.
   ============================================================ */
:root{
  --grund:#171310;
  --flaeche:#231D18;
  --schrift:#F3E9DA;
  --weich:#B7A692;
  --akzent:#E8B44C;        /* lamp */
  --akzent-2:#8FB4DF;
  --kante:rgba(243,233,218,.26);

  --display:"Arial Black","Helvetica Neue",Impact,sans-serif;
  --text:"American Typewriter","Courier New",serif;
}
[data-theme="light"]{
  --grund:#EFE7DA; --flaeche:#FFFFFF; --schrift:#1B1611; --weich:#544838;
  --akzent:#8A5A00; --akzent-2:#1B3F8B; --kante:rgba(27,22,17,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--grund);color:var(--schrift);font:17px/1.62 var(--text)}
.wrap{max-width:880px;margin:0 auto;padding:34px 20px 70px}

/* ---- the vault ---- */
.gewoelbe{border:3px solid var(--kante);border-bottom:0;
  border-radius:min(220px,42vw) min(220px,42vw) 0 0;padding:clamp(30px,7vw,58px) clamp(20px,5vw,44px) 0;
  text-align:center}
h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(25px,5.2vw,37px);
  line-height:1;letter-spacing:-.025em;text-transform:uppercase}
h1 span{display:block;color:var(--akzent)}
.lead{margin:14px auto 0;max-width:34ch;font-size:16.5px;color:var(--weich)}

.fragen{margin:28px auto 0;max-width:420px;display:grid;gap:14px}
.feld label{display:block;font-size:15px;color:var(--weich);margin-bottom:4px;text-align:left}
.feld input,.feld select{width:100%;border:0;background:var(--flaeche);color:var(--schrift);
  font:19px/1.2 var(--display);font-weight:900;padding:13px 14px;text-align:left;
  box-shadow:inset 0 0 0 2px var(--kante)}
.feld select{appearance:none;cursor:pointer}
.los{border:0;cursor:pointer;background:var(--akzent);color:var(--grund);
  font-family:var(--display);font-size:17px;font-weight:900;text-transform:uppercase;
  letter-spacing:.05em;padding:17px}

/* ---- the lamp chain ---- */
.kette{margin:38px auto 0;max-width:520px;position:relative;padding-left:38px;text-align:left}
.kette::before{content:'';position:absolute;left:13px;top:8px;bottom:8px;width:2px;
  background:var(--kante)}
.lampe{position:relative;padding:16px 0}
.lampe::before{content:'';position:absolute;left:-31px;top:23px;width:16px;height:16px;
  border-radius:50%;background:var(--akzent);box-shadow:0 0 0 5px color-mix(in srgb,var(--akzent) 26%,transparent)}
.lampe .wann{font-family:var(--display);font-size:16px;font-weight:900;color:var(--akzent)}
.lampe .name{display:block;font-family:var(--display);font-size:20px;font-weight:900;line-height:1.15;margin-top:2px}
.lampe .dazu{display:block;margin-top:4px;font-size:15.5px;color:var(--weich)}
.lampe .mass{float:right;font-family:var(--display);font-size:18px;font-weight:900;color:var(--akzent-2)}

h2{margin:40px 0 14px;font-family:var(--display);font-size:17px;font-weight:900;
  text-transform:uppercase;letter-spacing:.04em;color:var(--weich)}
.tour{display:block;width:100%;text-align:left;border:0;background:var(--flaeche);
  box-shadow:inset 0 0 0 2px var(--kante);color:inherit;font:inherit;padding:16px;
  margin-bottom:11px;cursor:pointer}
.tour.an{box-shadow:inset 0 0 0 3px var(--akzent)}
.tour strong{display:block;font-family:var(--display);font-size:19px;font-weight:900;line-height:1.2}
.tour span{display:block;margin-top:4px;font-size:15.5px;color:var(--weich)}
footer{margin-top:24px;font-size:15px;color:var(--weich)}
</style>
</head>
<body>
<div class="wrap">
  <div class="gewoelbe">
    <h1>Biergarten <span>Freunde</span></h1>
    <p class="lead">Zwei Fragen im Keller, drei Abende im Freien.</p>

    <div class="fragen">
      <div class="feld">
        <label for="ort">Wo gehst du los</label>
        <input id="ort" value="Candidplatz">
      </div>
      <div class="feld">
        <label for="zeit">Wie lange hast du</label>
        <select id="zeit"><option>4 Stunden</option><option>3 Stunden</option><option>6 Stunden</option></select>
      </div>
      <button class="los">Tour bauen</button>
    </div>
  </div>

  <h2>Drei Abende</h2>
  <button class="tour an">
    <strong>Flaucher → Hinterbrühl</strong>
    <span>2 Stationen · 3 Std 40 · zurück um 20:10 · Maß ab 10,40</span>
  </button>
  <button class="tour">
    <strong>Hirschgarten → Taxisgarten → Augustiner-Keller</strong>
    <span>3 Stationen · 3 Std 55 · zurück um 20:25 · Maß ab 9,90</span>
  </button>
  <button class="tour">
    <strong>Michaeligarten → Hofbräukeller</strong>
    <span>2 Stationen · 3 Std 10 · zurück um 20:10 · Maß ab 9,80</span>
  </button>

  <h2>Dein Abend</h2>
  <div class="kette">
    <div class="lampe">
      <span class="mass">10,80</span>
      <span class="wann">16:30</span>
      <span class="name">Zum Flaucher</span>
      <span class="dazu">18 min mit dem Radl · offen bis 23:00</span>
    </div>
    <div class="lampe">
      <span class="mass">10,40</span>
      <span class="wann">18:40</span>
      <span class="name">Gasthof Hinterbrühl</span>
      <span class="dazu">12 min mit dem Radl · offen bis 23:00</span>
    </div>
  </div>
  <footer>Preise sind Beispielwerte — der Crawler füllt sie.</footer>
</div>
<script>
  const p = new URLSearchParams(location.search).get('theme')
  if (p) document.documentElement.dataset.theme = p
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biergarten Freunde · Raster</title>
<link rel="stylesheet" href="basis.css">
<style>

/* RASTER — square mats in a strict grid, the way they come out of the
   box. Order does the work that colour does elsewhere; the chosen one
   gets a cap pressed onto it and nothing else changes. */
.raster{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tour .deckel{aspect-ratio:1;display:flex;flex-direction:column;justify-content:space-between}
.tour.an .deckel{box-shadow:inset 0 0 0 3px var(--akzent)}
.tour .korken{position:absolute;right:-16px;top:-16px;opacity:0}
.tour.an .korken{opacity:1}
.tour .summe{font-size:15.5px;color:var(--weich)}

</style>
</head>
<body>
<div class="wrap">
  <header data-kopf></header>
  <div class="riss-kante"></div>
  <p class="lead">Wie sie aus der Schachtel kommen. Der Korken markiert die gewählte.</p>
  <div class="einfach">
    <div class="chipreihe"><button class="chip" popovertarget="p-ort"><span class="was">Wo gehst du los</span><span class="wert">Candidplatz</span></button>
      <button class="chip" popovertarget="p-zeit"><span class="was">Wie lange hast du</span><span class="wert">4 Stunden</span></button>
      <button class="chip" popovertarget="p-weg"><span class="was">Wie unterwegs</span><span class="wert">Zu Fuß &amp; Radl</span></button></div>
    <h2>Drei Abende</h2>
    <div class="raster">
    
      <button class="tour an"><span class="deckel"><span class="korken" style="--gr:60px" aria-pressed="true"><span class="rand"></span><span class="mitte"><span class="zahl">2</span><span class="wort">Halte</span></span></span>
        <span class="name">Flaucher → Hinterbrühl</span>
        <span class="summe">2 Stationen<br>3 Std 40 · zurück um 20:10</span></span></button>
      <button class="tour "><span class="deckel"><span class="korken" style="--gr:60px" aria-pressed="true"><span class="rand"></span><span class="mitte"><span class="zahl">3</span><span class="wort">Halte</span></span></span>
        <span class="name">Hirschgarten → Taxisgarten → Keller</span>
        <span class="summe">3 Stationen<br>3 Std 55 · zurück um 20:25</span></span></button>
      <button class="tour "><span class="deckel"><span class="korken" style="--gr:60px" aria-pressed="true"><span class="rand"></span><span class="mitte"><span class="zahl">2</span><span class="wort">Halte</span></span></span>
        <span class="name">Michaeligarten → Hofbräukeller</span>
        <span class="summe">2 Stationen<br>3 Std 10 · zurück um 20:10</span></span></button>
    </div>
    <h2>Dein Abend</h2>
    <div class="halt"><span class="wann">16:30</span><span class="name">Zum Flaucher<small>18 min mit dem Radl · offen bis 23:00</small></span><span class="mass">10,80</span></div>
    <div class="halt"><span class="wann">18:40</span><span class="name">Gasthof Hinterbrühl<small>12 min mit dem Radl · offen bis 23:00</small></span><span class="mass">10,40</span></div>
  </div>
  <footer>Preise sind Beispielwerte — der Crawler füllt sie.</footer>
  <div data-profi></div>
</div>
<div data-panels></div>
<script src="basis.js"></script>
</body>
</html>

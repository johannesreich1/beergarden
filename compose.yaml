name: beergarden

services:
  app:
    build: ./api
    ports:
      - "8080:80"
    environment:
      # Without an explicit SERVER_NAME, FrankenPHP starts with automatic
      # HTTPS. Locally that is only in the way.
      SERVER_NAME: ":80"
      # Caddy does not resolve index.html for a directory; it falls through to
      # Laravel's index.php — /prototype/ would otherwise be a 404 from the
      # router. Path matchers without * match exactly, so / stays / and does
      # not swallow /api.
      CADDY_SERVER_EXTRA_DIRECTIVES: |
        rewrite / /prototype/index.html
        rewrite /prototype /prototype/index.html
        rewrite /prototype/ /prototype/index.html
        rewrite /design /design/index.html
        rewrite /design/ /design/index.html
    volumes:
      - ./api:/app
      # The prototype stays in the repo root and is only mounted — no copy to
      # drift apart. Reachable under /prototype/.
      - ./prototype:/app/public/prototype:ro
      # Source for the seeder. Read-only to make clear the JSON files are input.
      - ./data:/app/data:ro
      # The design drafts. Served over HTTP so the gallery can load its
      # previews in iframes — Chrome blocks that over file://.
      - ./design:/app/public/design:ro
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

  db:
    image: mariadb:12.3
    environment:
      MARIADB_DATABASE: beergarden
      MARIADB_USER: beergarden
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      # Also creates beergarden_test. Only runs on the very first start of an
      # empty volume — so after touching the schema here, docker compose down -v.
      - ./docker/mariadb-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      # Without a health check, app starts before the database and the first
      # migrate fails reproducibly.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  cache:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      # node_modules as its own volume rather than mounted from the host:
      # Rollup and esbuild ship native binaries, and a macOS host's do not run
      # inside a Linux container.
      - web_node_modules:/app/node_modules
    environment:
      NUXT_API_BASE: http://app
    depends_on:
      - app

volumes:
  dbdata:
  web_node_modules:

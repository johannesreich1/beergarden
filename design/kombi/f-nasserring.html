<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biergarten Freunde · Nasser Ring</title>
<link rel="stylesheet" href="basis.css">
<style>

/* NASSER RING — the mark a cold glass leaves. Selection is a wet ring
   on the mat, not a coloured frame: the quietest possible "this one",
   and the only ornament the page allows itself. */
.tour{margin-bottom:14px}
.tour .deckel{overflow:hidden}
.tour .ring{position:absolute;right:14px;top:50%;width:74px;height:74px;
  transform:translateY(-50%);border-radius:50%;box-shadow:inset 0 0 0 5px rgba(32,22,10,.16);
  opacity:0}
.tour.an .ring{opacity:1}
.tour.an .deckel{box-shadow:inset 0 0 0 2px var(--kante-satt)}
.tour .deckel{padding-right:104px}
.chipreihe .chip{flex:1 1 200px}

</style>
</head>
<body>
<div class="wrap">
  <header data-kopf></header>
  <div class="riss-kante"></div>
  <p class="lead">Wo das Glas stand, ist die Wahl.</p>
  <div class="einfach">
    <div class="chipreihe"><button class="chip" popovertarget="p-ort"><span class="was">Wo gehst du los</span><span class="wert">Candidplatz</span></button>
      <button class="chip" popovertarget="p-zeit"><span class="was">Wie lange hast du</span><span class="wert">4 Stunden</span></button>
      <button class="chip" popovertarget="p-weg"><span class="was">Wie unterwegs</span><span class="wert">Zu Fuß &amp; Radl</span></button>
      <button class="chip" popovertarget="p-was"><span class="was">Was soll dabei sein</span><span class="wert">egal</span></button>
      <button class="chip" popovertarget="p-extra"><span class="was">Was brauchst du</span><span class="wert">egal</span></button></div>
    <h2>Drei Abende</h2>
    
    <button class="tour an"><span class="deckel"><span class="ring"></span>
      <span class="name">Flaucher → Hinterbrühl</span>
      <span class="dazu">2 Stationen · 3 Std 40 · zurück um 20:10</span></span></button>
    <button class="tour "><span class="deckel"><span class="ring"></span>
      <span class="name">Hirschgarten → Taxisgarten → Keller</span>
      <span class="dazu">3 Stationen · 3 Std 55 · zurück um 20:25</span></span></button>
    <button class="tour "><span class="deckel"><span class="ring"></span>
      <span class="name">Michaeligarten → Hofbräukeller</span>
      <span class="dazu">2 Stationen · 3 Std 10 · zurück um 20:10</span></span></button>
    <h2>Dein Abend</h2>
    <div class="halt"><span class="wann">16:30</span><span class="name">Zum Flaucher<small>18 min mit dem Radl · offen bis 23:00</small></span><span class="mass">10,80</span></div>
    <div class="halt"><span class="wann">18:40</span><span class="name">Gasthof Hinterbrühl<small>12 min mit dem Radl · offen bis 23:00</small></span><span class="mass">10,40</span></div>
  </div>
  <footer>Preise sind Beispielwerte — der Crawler füllt sie.</footer>
  <div data-profi></div>
</div>
<div data-panels></div>
<script src="basis.js"></script>
</body>
</html>

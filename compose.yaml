name: beergarden

services:
  app:
    build: ./api
    ports:
      - "8080:80"
    environment:
      # Ohne explizites SERVER_NAME startet FrankenPHP mit automatischem HTTPS.
      # Lokal ist das nur im Weg.
      SERVER_NAME: ":80"
      # Caddy löst für ein Verzeichnis kein index.html auf, sondern fällt auf
      # Laravels index.php zurück — /prototype/ wäre sonst ein 404 aus dem
      # Router. Die Pfad-Matcher ohne * treffen exakt, / bleibt also / und
      # verschluckt nicht /api.
      CADDY_SERVER_EXTRA_DIRECTIVES: |
        rewrite / /prototype/index.html
        rewrite /prototype /prototype/index.html
        rewrite /prototype/ /prototype/index.html
        rewrite /design /design/index.html
        rewrite /design/ /design/index.html
    volumes:
      - ./api:/app
      # Der Prototyp bleibt im Repo-Root und wird nur eingehängt — keine Kopie,
      # die auseinanderläuft. Erreichbar unter /prototype/.
      - ./prototype:/app/public/prototype:ro
      # Quelle für den Seeder. Read-only, damit klar ist: die JSONs sind Eingabe.
      - ./data:/app/data:ro
      # Die Design-Entwürfe. Über HTTP ausgeliefert, damit die Galerie ihre
      # Vorschauen in iframes laden kann — über file:// blockiert Chrome das.
      - ./design:/app/public/design:ro
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

  db:
    image: mariadb:12.3
    environment:
      MARIADB_DATABASE: beergarden
      MARIADB_USER: beergarden
      MARIADB_PASSWORD: secret
      MARIADB_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      # Legt zusätzlich beergarden_test an. Läuft nur beim allerersten Start
      # eines leeren Volumes — nach einem Schema-Eingriff hier also
      # docker compose down -v.
      - ./docker/mariadb-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      # Ohne Healthcheck startet app schneller als die DB und der erste
      # migrate schlägt reproduzierbar fehl.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  cache:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      # node_modules als eigenes Volume, nicht aus dem Host gemountet: Rollup
      # und esbuild bringen native Binaries mit, und die eines macOS-Hosts
      # laufen in einem Linux-Container nicht.
      - web_node_modules:/app/node_modules
    environment:
      NUXT_API_BASE: http://app
    depends_on:
      - app

volumes:
  dbdata:
  web_node_modules:
